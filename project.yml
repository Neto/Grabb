name: Grabb
options:
  bundleIdPrefix: com.mentorneto
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  MARKETING_VERSION: "1.10.0"
  CURRENT_PROJECT_VERSION: "22"
  DEVELOPMENT_TEAM: FDWHNL3X82
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Grabb:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Grabb
        excludes:
          - "**/.DS_Store"
          - "Resources/Diagnostics/**"
      - path: Grabb/Resources/Diagnostics
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mentorneto.Grabb
        PRODUCT_NAME: Grabb
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle keys (update feed and public signing key). Merged with the generated keys.
        INFOPLIST_FILE: Grabb-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Grabb
        INFOPLIST_KEY_CFBundleName: Grabb
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Mentor Neto"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_LSMinimumSystemVersion: "15.0"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Grabb uses Safari only when you turn on browser cookies, to download videos from your account."
        CODE_SIGN_ENTITLEMENTS: Grabb/Grabb.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed Helpers
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        path: scripts/embed-helpers.sh
